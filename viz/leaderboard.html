<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditingBench — Leaderboard</title>
<style>
  :root{
    --bg:#0c1118; --card:#141c28; --card2:#0f1620; --border:#27323f; --fg:#e8eef5;
    --muted:#8a99ab; --accent:#4c9aff; --bar:#2563eb; --bar2:#1e3a8a;
    --c0:#7f1d1d; --c1:#b45309; --c2:#ca8a04; --c3:#65a30d; --c4:#16a34a;  /* heat ramp */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;
       font-size:15px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 4px}
  .meta{color:var(--muted);font-size:13px;margin:10px 0 22px}
  .meta b{color:var(--fg)}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     margin:34px 0 12px;border-bottom:1px solid var(--border);padding-bottom:6px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
  thead th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;
           background:var(--bg)}
  thead th:hover{color:var(--fg)}
  thead th.sorted::after{content:" ▾";color:var(--accent)}
  tbody tr:hover{background:var(--card)}
  .rank{color:var(--muted);width:34px}
  .model{font-weight:650}
  .tag{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);
       border-radius:5px;padding:1px 6px;margin-left:6px}
  .th{color:#ffd24a;border-color:#6b5a14}
  .partial{color:var(--muted);font-style:italic}
  /* correction-F1 bar cell */
  .f1cell{position:relative;min-width:230px}
  .f1bar{position:absolute;left:0;top:50%;transform:translateY(-50%);height:22px;border-radius:4px;
         background:linear-gradient(90deg,var(--bar2),var(--bar));opacity:.55;z-index:0}
  .f1txt{position:relative;z-index:1;font-variant-numeric:tabular-nums}
  .ci{color:var(--muted);font-size:12px}
  td.num{font-variant-numeric:tabular-nums}

  /* heatmap */
  table.heat td.h{color:#06140c;font-weight:700;text-align:center}
  .legend{color:var(--muted);font-size:12.5px;margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .tierbtn{background:var(--card2);color:var(--muted);border:1px solid var(--border);border-radius:8px;
           padding:6px 15px;cursor:pointer;font-size:13.5px}
  .tierbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  footer{color:var(--muted);font-size:12.5px;margin-top:36px;border-top:1px solid var(--border);padding-top:14px}
  code{background:var(--card);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>EditingBench — Leaderboard</h1>
  <p class="sub" id="subtitle">—</p>
  <div id="tiers" style="display:flex;gap:8px;margin:12px 0 4px"></div>
  <p class="meta" id="meta">—</p>

  <h2>Ranking</h2>
  <table id="board">
    <thead><tr>
      <th data-k="rank">#</th>
      <th data-k="display">Model</th>
      <th data-k="provider">Provider</th>
      <th data-k="corr_f1" class="sorted">Correction F1</th>
      <th data-k="det_f1">Detection F1</th>
      <th data-k="sent">Sentence acc</th>
      <th data-k="fidelity">Clean fidelity</th>
      <th data-k="gleu">GLEU</th>
      <th data-k="cherrant">ChERRANT F0.5</th>
      <th data-k="n">n</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>

  <h2>Per-class correction recall</h2>
  <table class="heat" id="heat">
    <thead><tr><th style="text-align:left">Model</th>
      <th>1 tone</th><th>2 consonant</th><th>3 การันต์</th><th>4 vowel</th><th>5 cluster</th><th>6 loanword</th>
    </tr></thead>
    <tbody id="heatbody"></tbody>
  </table>
  <div class="legend">
    <span><span class="sw" style="background:var(--c0)"></span>≤0.60</span>
    <span><span class="sw" style="background:var(--c1)"></span>0.70</span>
    <span><span class="sw" style="background:var(--c2)"></span>0.80</span>
    <span><span class="sw" style="background:var(--c3)"></span>0.90</span>
    <span><span class="sw" style="background:var(--c4)"></span>≥0.95</span>
  </div>

  <footer id="foot"></footer>
</div>

function heatColor(v){
  if(v==null) return "var(--border)";
  if(v>=0.95) return "var(--c4)"; if(v>=0.90) return "var(--c3)";
  if(v>=0.80) return "var(--c2)"; if(v>=0.70) return "var(--c1)"; return "var(--c0)";
}
const f3 = v => v==null ? "—" : v.toFixed(3);
const pct = v => v==null ? "—" : v.toFixed(2);

function renderTabs(){
  $("#tiers").innerHTML = D.tiers.map((t,i)=>
    `<button class="tierbtn${i===curTier?' on':''}" data-i="${i}">${t.label} · ${t.rows.length} models</button>`
  ).join("");
  document.querySelectorAll(".tierbtn").forEach(b=>{
    b.onclick = ()=>{ curTier = +b.dataset.i; render(); };
  });
}

function render(){
  $("#subtitle").textContent = D.benchmark;
  const T = D.tiers[curTier] || {max_n:0, rows:[]};

    return desc ? (y-x) : (x-y);
  });
  $("#body").innerHTML = rows.map((r,i)=>{
    const w = Math.round(r.corr_f1*100);

    const th = r.thai_native ? `<span class="tag th">🇹🇭 Thai-native</span>`:"";
    return `<tr>
      <td class="rank">${sortK==="corr_f1"&&desc ? (i+1) : ""}</td>
      <td class="model">${r.display}${th}${partial}</td>
      <td>${r.provider}</td>
      <td class="f1cell"><div class="f1bar" style="width:${w}%"></div>
          <span class="f1txt">${f3(r.corr_f1)}${ci}</span></td>
      <td class="num">${f3(r.det_f1)}</td>
      <td class="num">${f3(r.sent)}</td>
      <td class="num">${f3(r.fidelity)}</td>
      <td class="num">${f3(r.gleu)}</td>
      <td class="num">${f3(r.cherrant)}</td>
      <td class="num">${r.n}</td>
    </tr>`;
  }).join("");

  $("#heatbody").innerHTML = rows.map(r=>{
    const cells = [1,2,3,4,5,6].map(c=>{
      const v=r.per_class[c];
      return `<td class="h" style="background:${heatColor(v)}">${pct(v)}</td>`;
    }).join("");
    return `<tr><td style="text-align:left" class="model">${r.display}</td>${cells}</tr>`;
  }).join("");

  document.querySelectorAll("thead th").forEach(th=>{
    th.classList.toggle("sorted", th.dataset.k===sortK);
  });
  renderTabs();
  $("#foot").innerHTML = `EditingBench · Track 1 Subtask 2 · grading via <code>grader.py</code> (TCC F1) + `+
    `<code>therrant.py</code> (ChERRANT span-F0.5). Click a column header to re-sort; switch tiers above. `+
    `Thai-native models tagged 🇹🇭. Partial = fewer items (run incomplete).`;
}

document.querySelectorAll("thead th").forEach(th=>{
  if(th.dataset.k==="rank") return;
  th.onclick = ()=>{ const k=th.dataset.k;
    if(k===sortK){ desc=!desc; } else { sortK=k; desc=true; }
    render(); };
});
renderTabs();
render();
</script>
</body>
</html>
